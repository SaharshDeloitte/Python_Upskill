<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastAPI Data Viewer</title>
    <style>
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            margin: 24px;
            background: #f5f7fb;
            color: #1f2937;
        }

        h2 {
            margin-bottom: 8px;
        }

        .section {
            background: #ffffff;
            border: 1px solid #dbe3ee;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 14px;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
        }

        button {
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            background: #2563eb;
            color: #fff;
            cursor: pointer;
            font-weight: 600;
        }

        button:hover {
            background: #1d4ed8;
        }

        input {
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            width: 120px;
        }

        textarea {
            width: 100%;
            min-height: 110px;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-family: inherit;
            margin-bottom: 12px;
            resize: vertical;
        }

        pre {
            background: #0f172a;
            color: #e2e8f0;
            padding: 14px;
            border-radius: 10px;
            min-height: 120px;
            overflow-x: auto;
            margin: 0;
        }
    </style>
</head>
<body>
    <h2>FastAPI Demo Apis</h2>

    <section class="section">
        <h3>Items</h3>
        <div class="controls">
            <button id="btnRoot" type="button">GET /</button>
            <button id="btnItems" type="button">GET /items</button>
            <input id="itemId" type="number" min="1" placeholder="Item ID">
            <button id="btnItemById" type="button">GET /items/:id</button>
        </div>
        <pre id="itemsOutput">—</pre>
    </section>

    <section class="section">
        <h3>Joke API</h3>
        <div class="controls">
            <button id="btnJoke" type="button">GET /joke</button>
        </div>
        <pre id="jokeOutput">—</pre>
    </section>

    <section class="section">
        <h3>Weather API</h3>
        <div class="controls">
            <input id="city" type="text" placeholder="Enter City">
            <button id="btnWeather" type="button">GET /weather</button>
        </div>
        <pre id="weatherOutput">—</pre>
    </section>

    <section class="section">
        <h3>Summary API</h3>
        <textarea id="summaryText" placeholder="Paste text to summarize..."></textarea>
        <div class="controls">
            <button id="btnSummary" type="button">POST /summary</button>
        </div>
        <pre id="summaryOutput">—</pre>
    </section>

    <script>
        const API_BASE_URL = "http://127.0.0.1:8000";
        const itemsOutput = document.getElementById("itemsOutput");
        const jokeOutput = document.getElementById("jokeOutput");
        const weatherOutput = document.getElementById("weatherOutput");
        const summaryOutput = document.getElementById("summaryOutput");
        const itemIdInput = document.getElementById("itemId");
        const cityInput = document.getElementById("city");
        const summaryTextInput = document.getElementById("summaryText");

        async function callApi(endpoint, targetOutput) {
            targetOutput.textContent = "Loading...";

            try {
                const response = await fetch(`${API_BASE_URL}${endpoint}`);
                const data = await response.json();

                if (!response.ok) {
                    targetOutput.textContent = `Error ${response.status}: ${JSON.stringify(data, null, 2)}`;
                    return;
                }

                targetOutput.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                targetOutput.textContent = `Request failed: ${error.message}`;
            }
        }

        async function callSummaryApi() {
            const text = summaryTextInput.value.trim();

            if (!text) {
                summaryOutput.textContent = "Please enter text first.";
                return;
            }

            summaryOutput.textContent = "Loading...";

            try {
                const response = await fetch(`${API_BASE_URL}/summary`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({ text }),
                });

                const data = await response.json();
                if (!response.ok) {
                    summaryOutput.textContent = `Error ${response.status}: ${JSON.stringify(data, null, 2)}`;
                    return;
                }

                summaryOutput.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                summaryOutput.textContent = `Request failed: ${error.message}`;
            }
        }

        document.getElementById("btnRoot").addEventListener("click", () => callApi("/", itemsOutput));
        document.getElementById("btnItems").addEventListener("click", () => callApi("/items", itemsOutput));

        document.getElementById("btnItemById").addEventListener("click", () => {
            const itemId = itemIdInput.value.trim();

            if (!itemId) {
                itemsOutput.textContent = "Please enter an Item ID first.";
                return;
            }

            callApi(`/items/${itemId}`, itemsOutput);
        });

        document.getElementById("btnJoke").addEventListener("click", () => {
            callApi("/joke", jokeOutput);
        });

        document.getElementById("btnWeather").addEventListener("click", () => {
            const city = cityInput.value.trim();

            if (!city) {
                weatherOutput.textContent = "Please enter city first.";
                return;
            }

            callApi(`/weather?city=${encodeURIComponent(city)}`, weatherOutput);
        });

        document.getElementById("btnSummary").addEventListener("click", () => {
            callSummaryApi();
        });
    </script>
</body>
</html>
